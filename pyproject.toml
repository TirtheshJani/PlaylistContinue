[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playlist-continue"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15.0",
    "numpy>=1.26",
    "torch>=2.2",
    "faiss-cpu>=1.8",
    "lightgbm>=4.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "gensim>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_continue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
