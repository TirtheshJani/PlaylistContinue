name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv pip install -e ".[dev]" --system
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/ --cov=src/playlist_continue --cov-report=term-missing
